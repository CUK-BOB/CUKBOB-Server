version: '3.8'

services:
  # 1. MySQL 컨테이너 설정
  db:
    image: mysql:8.0
    container_name: cukbob-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DATASOURCE_PASSWORD}
      MYSQL_DATABASE: cukbob
      TZ: Asia/Seoul
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql # DB 데이터를 컨테이너가 꺼져도 유지되도록 저장
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

  # 2. Spring Boot 앱 컨테이너 설정
  app:
    build: . # 현재 폴더의 Dockerfile로 빌드해라
    container_name: cukbob-server
    ports:
      - "8080:8080"
    depends_on:
      - db # DB가 먼저 켜진 뒤에 앱을 켜라
    environment:
      # [중요] docker 내부에서는 localhost 대신 서비스명(db)을 써야 함
      DATASOURCE_URL: jdbc:mysql://db:3306/cukbob?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false
      DATASOURCE_USERNAME: root
      DATASOURCE_PASSWORD: ${DATASOURCE_PASSWORD}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET}
      jwt.secret: ${JWT_SECRET}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID}
      APPLE_KEY_ID: ${APPLE_KEY_ID}
      APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY}

volumes:
  db_data: