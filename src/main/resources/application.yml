spring:
  application:
    name: CUKBOB

  datasource:
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: update
    show-sql: true

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/auth/{registrationId}/callback"
            scope: account_email

          apple:
            client-id: ${APPLE_CLIENT_ID}
            client-secret: ""
            redirect-uri: "{baseUrl}/auth/apple/callback"
            authorization-grant-type: authorization_code
            scope: name email

        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize #인가요청
            token-uri: https://kauth.kakao.com/oauth/token #토큰받기 URL
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-info-authentication-method: header
            user-name-attribute: id

          apple:
            authorization-uri: https://appleid.apple.com/auth/authorize
            token-uri: https://appleid.apple.com/auth/token

apple:
  team-id: ${APPLE_TEAM_ID}
  key-id: ${APPLE_KEY_ID}
  private-key: ${APPLE_PRIVATE_KEY}

  jwt:
    secret: ${jwt.secret}
    #expiration: 86400000  # 24시간 (1일)
